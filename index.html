<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAVATHREADS Hub</title>
    <style>
        :root {
            --primary: #2d3748;
            --accent: #4c51bf;
            --danger: #e53e3e;
            --success: #38a169;
            --bg: #f7fafc;
            --muted: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: var(--primary);
        }

        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 30px;
            background: linear-gradient(135deg, #ffffff 0%, #eef2ff 50%, #e2e8f0 100%);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .site-logo-wrapper {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            background: white;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
        }

        .site-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        h1 { margin: 0; font-size: 32px; letter-spacing: 0.04em; }

        .insta-handle {
            font-size: 14px;
            color: var(--muted);
            font-weight: 600;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: block;
            gap: 30px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #e2e8f0;
        }

        .product-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #edf2f7;
        }

        .product-img-placeholder {
            width: 100%;
            height: 220px;
            background-color: #edf2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a0aec0;
            font-weight: bold;
        }

        .product-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .product-title { font-size: 18px; font-weight: bold; margin: 0 0 6px 0; }
        .product-meta { font-size: 13px; color: #718096; margin-bottom: 8px; }
        .product-price { font-size: 20px; font-weight: bold; color: var(--accent); margin-bottom: 12px; }
        
        .stock-indicator {
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 15px;
            padding: 4px 8px;
            border-radius: 4px;
            width: fit-content;
        }
        .in-stock { background: #c6f6d5; color: #22543d; }
        .out-of-stock { background: #fed7d7; color: #742a2a; }

    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="site-logo-wrapper">
                <img src="logo.png" alt="NAVATHREADS logo" class="site-logo">
            </div>
            <div>
                <h1>NAVATHREADS Hub</h1>
                <a href="https://instagram.com/navathreads" target="_blank" rel="noopener noreferrer" class="insta-handle">@navathreads</a>
            </div>
        </div>
        <div style="display:flex; gap:16px; align-items:center;">
            <a href="cart.html" style="background: var(--accent); color: white; padding: 12px 18px; border-radius: 999px; text-decoration: none; font-weight: 700;">View Cart</a>
            <div style="color: var(--success); font-weight: bold;">● Live on GitHub Pages</div>
        </div>
    </header>

    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; max-width:1200px; margin:0 auto 20px;">
            <h2>Active Marketplace Listings</h2>
        </div>
        <div style="max-width:1200px; margin:0 auto;">
            <div class="products-grid" id="products-container"></div>
        </div>
    </div>

    <script>
        // HARDCODED PRODUCTS DATA (no backend needed)
        const PRODUCTS_DATA = [
          {"id": 1, "name": "Pastel Lucknowi Chikankari Kurta", "category": "Chikankari", "price": 2499, "stockCount": 0, "images": ["https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?auto=format&fit=crop&w=600&q=80", "https://images.unsplash.com/photo-1583394838336-acd977736f90?auto=format&fit=crop&w=600&q=80"]},
          {"id": 2, "name": "Minimalist Chic Satin Western Top", "category": "Western", "price": 1299, "stockCount": 2, "images": ["https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=600&q=80", "https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=600&q=80"]},
          {"id": 3, "name": "Royal Banarasi Silk Saree", "category": "Sarees", "price": 5499, "stockCount": 1, "images": ["https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=600&q=80", "https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?auto=format&fit=crop&w=600&q=80"]},
          {"id": 4, "name": "Elegance Tiered Maxi Dress", "category": "Women's Wear", "price": 2899, "stockCount": 4, "images": ["https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?auto=format&fit=crop&w=600&q=80", "https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=600&q=80"]},
          {"id": 5, "name": "Handcrafted Bandhani Kurta Set", "category": "Women's Wear", "price": 3399, "stockCount": 5, "images": ["https://images.unsplash.com/photo-1520614073990-dd6022d76bb6?auto=format&fit=crop&w=600&q=80", "https://images.unsplash.com/photo-1503341455253-b2e723bb3dbb?auto=format&fit=crop&w=600&q=80"]},
          {"id": 6, "name": "Embroidered Nehru Jacket", "category": "Men's Wear", "price": 2599, "stockCount": 3, "images": ["https://images.unsplash.com/photo-1521572267360-ee0c289ead41?auto=format&fit=crop&w=600&q=80", "https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=600&q=80"]},
          {"id": 7, "name": "Festive Printed Palazzo Set", "category": "Western", "price": 2199, "stockCount": 6, "images": ["https://images.unsplash.com/photo-1503341455253-b2e723bb3dbb?auto=format&fit=crop&w=600&q=80", "https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=600&q=80"]}
        ];
        
        const container = document.getElementById('products-container');

        // Load inventory on startup
        loadInventory();

        function loadInventory() {
            const products = PRODUCTS_DATA;
            container.innerHTML = '';
            if (products.length === 0) {
                container.innerHTML = '<p style="color:#718096">No inventory items found.</p>';
                return;
            }

            products.forEach(p => {
                const isStock = p.stockCount > 0;
                const hasImg = p.images && p.images.length > 0;
                const imgSrc = hasImg ? p.images[0] : '';
                const imgElem = hasImg
                    ? `<img src="${imgSrc}" class="product-img" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=product-img-placeholder>📦 Image Needed</div>'">`
                    : `<div class="product-img-placeholder">📦 Image Needed</div>`;

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    ${imgElem}
                    <div class="product-info">
                        <div class="product-title">${p.name}</div>
                        <div class="product-meta">Category: ${p.category}</div>
                        <div class="product-price">₹${p.price}</div>
                        <div class="stock-indicator ${isStock ? 'in-stock' : 'out-of-stock'}">
                            ${isStock ? `In Stock (${p.stockCount})` : 'Out of Stock'}
                        </div>
                        <div style="margin-top:auto;">
                            <a href="product.html?id=${p.id}"><button class="secondary">View</button></a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
