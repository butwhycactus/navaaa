<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAVATHREADS Cart</title>
    <style>
        :root {
            --bg: #f7fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --accent: #4c51bf;
            --accent-dark: #2d3748;
            --danger: #e53e3e;
            --muted: #64748b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--accent-dark);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 30px;
            background: linear-gradient(135deg, #ffffff 0%, #eef2ff 50%, #e2e8f0 100%);
            border-radius: 0 0 24px 24px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
        }
        .header-left { display:flex; align-items:center; gap:18px; }
        .site-logo-wrapper { width:88px; height:88px; border-radius:24px; overflow:hidden; background:white; box-shadow:0 10px 30px rgba(0,0,0,0.12); }
        .site-logo { width:100%; height:100%; object-fit:cover; display:block; }
        h1 { margin:0; font-size:28px; }
        a { text-decoration:none; }
        .nav-actions a { padding:12px 18px; border-radius:999px; background:var(--accent); color:white; font-weight:700; }
        .page { max-width:1200px; margin:32px auto; padding:0 20px; }
        .panel { background:white; border:1px solid var(--border); border-radius:24px; padding:28px; box-shadow:0 12px 30px rgba(15,23,42,0.06); }
        .section-title { margin:0 0 18px; font-size:22px; }
        .cart-item { display:grid; grid-template-columns:90px 1fr auto; gap:18px; align-items:center; padding:18px 0; border-bottom:1px solid #f3f4f6; }
        .cart-item:last-child { border-bottom:none; }
        .cart-item img { width:90px; height:90px; object-fit:cover; border-radius:18px; background:#f8fafc; }
        .item-name { font-weight:700; margin-bottom:6px; }
        .item-meta { color:var(--muted); font-size:14px; }
        .quantity-controls { display:flex; align-items:center; gap:10px; margin-top:10px; }
        .quantity-controls button { width:34px; height:34px; border:none; border-radius:12px; background:#f1f5f9; cursor:pointer; font-size:18px; }
        .remove-button { background:#fee2e2; color:var(--danger); padding:10px 14px; border:none; border-radius:12px; cursor:pointer; }
        .summary { display:flex; justify-content:space-between; align-items:center; margin-top:26px; font-size:18px; font-weight:700; }
        .checkout-button { width:100%; display:inline-flex; justify-content:center; padding:16px 0; background:var(--accent); color:white; border:none; border-radius:18px; font-size:16px; font-weight:700; cursor:pointer; margin-top:22px; }
        .checkout-button:disabled { background:#c7d2fe; cursor:not-allowed; }
        .empty-state { color:var(--muted); line-height:1.8; }
        .auth-panel { margin-bottom:24px; padding:20px; border-radius:18px; background:#f8fafc; border:1px solid var(--border); }
        .auth-panel button { border:none; border-radius:14px; padding:14px 18px; cursor:pointer; font-weight:700; }
        .auth-primary { background:var(--accent); color:white; }
        .auth-secondary { background:white; color:var(--accent-dark); border:1px solid var(--border); }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <div class="site-logo-wrapper"><img src="logo.png" alt="NAVATHREADS logo" class="site-logo"></div>
            <div>
                <h1>NAVATHREADS Cart</h1>
                <div style="color:var(--muted);">Review your bag and checkout securely.</div>
            </div>
        </div>
        <div class="nav-actions"><a href="index.html">Back to Store</a></div>
    </header>
    <main class="page">
        <div class="panel">
            <div class="section-title">Your Cart</div>
            <div id="cart-list"></div>
            <div id="cart-summary" class="summary"></div>
            <button id="checkout-button" class="checkout-button">Checkout</button>
            <div id="cart-message" style="margin-top:16px; color:var(--muted);"></div>
        </div>
        <div class="panel auth-panel" id="auth-panel"></div>
    </main>
    <script>
        const CART_KEY = 'navathreads_cart';
        const AUTH_KEY = 'navathreads_user';

        function getCart() {
            try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; } catch { return []; }
        }
        function saveCart(cart) { localStorage.setItem(CART_KEY, JSON.stringify(cart)); }
        function getUser() { try { return JSON.parse(localStorage.getItem(AUTH_KEY)); } catch { return null; } }
        function setUser(user) { localStorage.setItem(AUTH_KEY, JSON.stringify(user)); }
        function clearUser() { localStorage.removeItem(AUTH_KEY); }

        function renderAuth() {
            const authPanel = document.getElementById('auth-panel');
            const user = getUser();
            if (user) {
                authPanel.innerHTML = `
                    <div style="font-weight:700; margin-bottom:10px;">Signed in as ${user.name}</div>
                    <div style="color:var(--muted); margin-bottom:18px;">Phone: ${user.phone}</div>
                    <button class="auth-secondary" onclick="logout()">Logout</button>
                `;
                return;
            }
            authPanel.innerHTML = `
                <div style="font-weight:700; margin-bottom:10px;">Login to checkout</div>
                <button class="auth-primary" onclick="location.href='login.html?return=cart.html'">Login / Register</button>
            `;
        }

        function renderCart() {
            const list = document.getElementById('cart-list');
            const summary = document.getElementById('cart-summary');
            const button = document.getElementById('checkout-button');
            const cart = getCart();
            if (!cart.length) {
                list.innerHTML = `<div class="empty-state">Your cart is empty. Add products from the store to begin checkout.</div>`;
                summary.textContent = '';
                button.disabled = true;
                return;
            }
            let total = 0;
            list.innerHTML = '';
            cart.forEach(item => {
                total += item.price * item.quantity;
                const itemNode = document.createElement('div');
                itemNode.className = 'cart-item';
                itemNode.innerHTML = `
                    <img src="${item.image || 'https://via.placeholder.com/90?text=No+Image'}" alt="${item.name}">
                    <div>
                        <div class="item-name">${item.name}</div>
                        <div class="item-meta">₹${item.price} x ${item.quantity} = ₹${item.price * item.quantity}</div>
                        <div class="quantity-controls">
                            <button onclick="changeQuantity(${item.productId}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button onclick="changeQuantity(${item.productId}, 1)">+</button>
                        </div>
                    </div>
                    <button class="remove-button" onclick="removeItem(${item.productId})">Remove</button>
                `;
                list.appendChild(itemNode);
            });
            summary.innerHTML = `<span>${cart.length} items</span><span>Total ₹${total}</span>`;
            button.disabled = false;
        }

        function changeQuantity(productId, delta) {
            const cart = getCart();
            const item = cart.find(i => i.productId === productId);
            if (!item) return;
            item.quantity = Math.max(1, item.quantity + delta);
            saveCart(cart);
            renderCart();
        }

        function removeItem(productId) {
            const cart = getCart().filter(i => i.productId !== productId);
            saveCart(cart);
            renderCart();
        }

        async function checkout() {
            const user = getUser();
            if (!user) {
                location.href = 'login.html?return=cart.html';
                return;
            }
            const cart = getCart();
            if (!cart.length) return;
            for (const item of cart) {
                const res = await fetch('/api/purchase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productId: item.productId, phone: user.phone, quantity: item.quantity })
                });
                const data = await res.json();
                if (!res.ok) { alert(data.message || 'Checkout failed.'); return; }
            }
            saveCart([]);
            renderCart();
            alert('Checkout successful. Thank you for your order!');
        }

        function logout() { clearUser(); renderAuth(); }

        document.getElementById('checkout-button').addEventListener('click', checkout);
        renderAuth();
        renderCart();
    </script>
</body>
</html>
