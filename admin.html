<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Add Product</title>
    <style>
        body{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#f7fafc; padding:30px; }
        .card{ max-width:700px; margin:30px auto; background:white; padding:20px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.06); }
        label{ display:block; margin-top:10px; font-weight:600 }
        input, select, button{ width:100%; padding:10px; margin-top:8px; border:1px solid #d1d5db; border-radius:6px }
        button{ background:#4c51bf; color:white; border:none; font-weight:700 }
        a{ display:inline-block; margin-top:12px }
    </style>
</head>
<body>
    <div class="card">
        <h2>Add New Product (Admin)</h2>
        <form id="admin-form">
            <label>Product Title</label>
            <input id="name" required>

            <label>Category</label>
            <select id="category">
                <option>Chikankari</option>
                <option>Sarees</option>
                <option>Western</option>
                <option>Women's Wear</option>
            </select>

            <label>Price (₹)</label>
            <input id="price" type="number" required>

            <label>Stock Count</label>
            <input id="stock" type="number" required>

            <label>Image URL (optional)</label>
            <input id="image" placeholder="/images/example.jpg or https://...">

            <button type="submit">Save Product</button>
        </form>
        <a href="/">← Back to Storefront</a>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:3000';
        const form = document.getElementById('admin-form');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                price: Number(document.getElementById('price').value) || 0,
                stockCount: Number(document.getElementById('stock').value) || 0,
                images: []
            };
            const img = document.getElementById('image').value.trim();
            if(img) payload.images.push(img);

            try{
                const res = await fetch(`${API_BASE}/api/products/upload`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if(res.ok){
                    alert('Product added');
                    window.location.href = '/';
                } else {
                    const err = await res.json().catch(()=>({}));
                    alert('Error: ' + (err.message || res.statusText));
                }
            } catch(err){
                alert('Network error: '+err.message);
            }
        });
    </script>
</body>
</html>
